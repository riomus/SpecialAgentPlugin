[/Script/SpecialAgent.SpecialAgentSettings]
; Server Configuration
ServerEnabled=true
ServerPort=8767
; Interface to bind. Default 127.0.0.1 (localhost only) — the server runs
; arbitrary Python, so do NOT expose it to the network. Set "0.0.0.0" only if
; you understand the risk, and then also set AuthToken below.
BindAddress=127.0.0.1
; Optional shared secret. When non-empty, every request must send
; "Authorization: Bearer <token>". Empty = disabled (localhost binding is the guard).
AuthToken=
TransportType=SSE
MaxConcurrentRequests=10

; Asset Service
AssetCacheEnabled=true
AssetCacheRefreshInterval=5.0

; Python Service
PythonSandboxEnabled=true
PythonExecutionTimeout=30.0
AllowedPythonModules=unreal,math,json,random

; Viewport Service
DefaultScreenshotWidth=1920
DefaultScreenshotHeight=1080
ScreenshotFormat=PNG

; Logging
LogLevel=Verbose
LogToFile=true

